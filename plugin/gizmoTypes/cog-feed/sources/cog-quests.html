<div class="feed-location-type">
	<label class="check-row compact">
		<input type="checkbox" data-gizmo-value="showQuestStatus" data-gizmo-default="true" data-cog-feed-nested="quest-status">
		<span data-translation="cog-feed-quest-status" data-translation-fallback="Quest Status">Quest Status</span>
	</label>
	<div class="style-row feed-location-row is-nested" data-cog-feed-nested-panel="quest-status">
		<input type="color" data-gizmo-field="color" data-gizmo-value="questStatusColor" data-gizmo-default="#e8d2a0" data-translation="cog-colour" data-translation-fallback="Colour">
		<input type="text" data-gizmo-field="icon" data-gizmo-value="questStatusIcon" data-gizmo-default="Scribe/scroll.svg" data-translation="cog-icon" data-translation-fallback="Icon">
	</div>
</div>
<div class="feed-location-type">
	<label class="check-row compact">
		<input type="checkbox" data-gizmo-value="showQuestObjectives" data-gizmo-default="true" data-cog-feed-nested="quest-objectives">
		<span data-translation="cog-feed-quest-objectives" data-translation-fallback="Quest Objectives">Quest Objectives</span>
	</label>
	<div class="style-row feed-location-row is-nested" data-cog-feed-nested-panel="quest-objectives">
		<input type="color" data-gizmo-field="color" data-gizmo-value="questObjectiveColor" data-gizmo-default="#e8d2a0" data-translation="cog-colour" data-translation-fallback="Colour">
		<input type="text" data-gizmo-field="icon" data-gizmo-value="questObjectiveIcon" data-gizmo-default="Scribe/list.svg" data-translation="cog-icon" data-translation-fallback="Icon">
	</div>
</div>
<label class="check-row compact">
	<input type="checkbox" data-gizmo-value="showQuestIcons" data-gizmo-default="true">
	<span data-translation="cog-feed-show-icons" data-translation-fallback="Show Icons">Show Icons</span>
</label>
<div data-cog-feed-notes="quests"></div>
<script>
(function () {
	var panel = document.currentScript && document.currentScript.parentElement;
	if (!panel) return;
	var sourceHost = panel.closest("[data-feed-source]");
	var sourceId = sourceHost ? sourceHost.getAttribute("data-feed-source") : "cog-quests";
	var root = panel.closest(".gizmo-html-settings");
	if (!root) return;

	function storagePath() {
		if (typeof window.CogFeedSourceStorage === "function") {
			return window.CogFeedSourceStorage(sourceId);
		}
		return "gizmoTypes/cog-feed/sources/" + sourceId;
	}

	function syncNested() {
		panel.querySelectorAll("[data-cog-feed-nested]").forEach(function (input) {
			var key = input.getAttribute("data-cog-feed-nested");
			var nested = panel.querySelector('[data-cog-feed-nested-panel="' + key + '"]');
			if (nested) nested.hidden = !input.checked;
		});
	}

	function mountNotes() {
		if (typeof window.CogAppendFeedSectionNotes !== "function") return;
		var hide = typeof window.CogFeedHideNoteEntry === "function" ? window.CogFeedHideNoteEntry : function () { return null; };
		var host = panel.querySelector('[data-cog-feed-notes="quests"]');
		if (!host) return;
		window.CogAppendFeedSectionNotes(host, "", storagePath() + "/", { hideEntry: hide("quests") });
	}

	function onBound() {
		syncNested();
		mountNotes();
	}

	root.addEventListener("cog-html-settings-bound", onBound);
	panel.querySelectorAll("[data-cog-feed-nested]").forEach(function (el) {
		el.addEventListener("change", syncNested);
	});
	onBound();
})();
</script>
