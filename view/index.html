			<header class="banner">

				<h1 class="banner-title">
					<span class="acronym-c">C</span><span class="word-rest">ustom</span>

					<span class="acronym-g">G</span><span class="word-rest">adgets</span>

			</header>
			<nav class="tabs" id="tabs">
				<button type="button" class="tab is-active" data-tab="general">General</button>
