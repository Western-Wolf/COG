<!-- Example Feed source settings — colour + icon for the registered countdown source.
     Bound under settings.sources.<sourceId> via the Feed Sources accordion (data-feed-source). -->
<div class="style-row">
	<input type="color" data-gizmo-field="color" data-gizmo-value="textColor" data-gizmo-default="#E8D2A0" data-translation="cog-colour" data-translation-fallback="Colour">
	<input type="text" data-gizmo-field="icon" data-gizmo-value="icon" data-gizmo-default="COG_Example/light-bulb-fill.png" data-translation="cog-icon" data-translation-fallback="Icon">
</div>
